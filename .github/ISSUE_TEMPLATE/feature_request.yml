name: 💡 Feature Request
description: Suggest an idea or enhancement for Kiwi Photos
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature suggestions that adhere to our **100% On-Device Privacy** and **Zero Cloud Leaks** core philosophy!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
  - type: checkboxes
    id: privacy-compliance
    attributes:
      label: Privacy & Architecture Compliance
      description: Confirm compliance with Kiwi Photos core tenets
      options:
        - label: This feature operates 100% on-device without cloud telemetry or external third-party servers.
          required: true
        - label: Heavy computational work is designed to run asynchronously off the main thread.
          required: true
