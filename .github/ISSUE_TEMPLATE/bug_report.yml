name: 🐛 Bug Report
description: Create a report to help us reproduce and fix an issue in Kiwi Photos
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked existing issues first to avoid duplicates.
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: What version of Kiwi Photos are you using?
      placeholder: "e.g. 2.0.0 (commit 99ddcff)"
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Device & Android Version
      description: What device hardware and Android OS version are you running?
      placeholder: "e.g. Google Pixel 8 Pro - Android 15 (API 35)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step description of how to reproduce the issue.
      placeholder: |
        1. Open 'Photos' tab
        2. Select photo and tap 'Subject Lift'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include crash logs / logcat if applicable)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat / Stack Trace
      description: Paste relevant logcat logs here (run `adb logcat -s KiwiPhotos`).
      render: shell
