<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2d4a3e", // Forest green for nature-inspired aesthetic
                        "accent-green": "#2d4a3e",
                        "background-light": "#faf9f6", // Soft cream/off-white
                        "background-dark": "#1a1c1a",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center justify-between p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-10">
<button class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">arrow_back</span>
</button>
<div class="flex-1 text-center">
<span class="text-xs font-semibold uppercase tracking-widest text-primary/60 dark:text-primary/40">Nature Gallery</span>
</div>
<button class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">info</span>
</button>
</header>
<!-- Main Content (Central Image) -->
<main class="flex-grow flex flex-col items-center justify-center px-4 py-6">
<div class="w-full aspect-[4/5] rounded-xl overflow-hidden shadow-xl bg-slate-200 dark:bg-slate-800">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Sunlight streaming through tall green forest trees" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDY6ug7TH-OI1sQqOYS7DTO88Pz9G2UzeZNXdfrdf5Qn39Jx3DV_LW7MavavVxMWKWP6ghT-ZGo9aDn8GUvsaeJrLgK5CUUix5C4ssR-idqlyrNnrGGOhVwI1AFAkOJpwfOw05yAvBE2bMH1wbUwA0GcVTde7w1tw42AHhGzSKXQkFQdV8F-o8EMrMB60yFDgU9j_vYTUPeFXRf_yPmxNzH9YgXnB9VIWdu5E44BwEyzd0f4WdvftnECfAa_1_IlgCNVtCfTnmmQZQ");'>
</div>
</div>
<div class="mt-8 text-center space-y-2">
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-50">Forest Whispers</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Captured Oct 24, 2023 • 4.2 MB • 4032 x 3024</p>
<div class="flex items-center justify-center gap-2 mt-4">
<span class="px-3 py-1 bg-primary/10 text-primary text-xs font-bold rounded-full uppercase tracking-tighter">Raw Digital</span>
<span class="px-3 py-1 bg-primary/10 text-primary text-xs font-bold rounded-full uppercase tracking-tighter">Nature</span>
</div>
</div>
</main>
<!-- Footer / Action Bar -->
<footer class="mt-auto p-4 pb-8 border-t border-slate-200 dark:border-slate-800 bg-background-light dark:bg-background-dark">
<div class="flex items-center justify-around max-w-sm mx-auto">
<!-- Favorite -->
<button class="flex flex-col items-center gap-1 group">
<div class="h-12 w-12 flex items-center justify-center rounded-full bg-primary/5 group-hover:bg-primary/10 transition-all">
<span class="material-symbols-outlined text-primary filled">favorite</span>
</div>
<span class="text-[10px] font-bold uppercase text-primary">Favorite</span>
</button>
<!-- Share -->
<button class="flex flex-col items-center gap-1 group">
<div class="h-12 w-12 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 group-hover:bg-primary/10 transition-all">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400 group-hover:text-primary">share</span>
</div>
<span class="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 group-hover:text-primary">Share</span>
</button>
<!-- Edit -->
<button class="flex flex-col items-center gap-1 group">
<div class="h-12 w-12 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 group-hover:bg-primary/10 transition-all">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400 group-hover:text-primary">edit</span>
</div>
<span class="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 group-hover:text-primary">Edit</span>
</button>
<!-- Delete -->
<button class="flex flex-col items-center gap-1 group">
<div class="h-12 w-12 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 group-hover:bg-red-50 dark:group-hover:bg-red-950 transition-all">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400 group-hover:text-red-600">delete</span>
</div>
<span class="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 group-hover:text-red-600">Delete</span>
</button>
</div>
</footer>
<!-- Bottom Navigation Spacer (for mobile) -->
<div class="h-4 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
