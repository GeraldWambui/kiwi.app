<title>Kiwi Gallery - Search Results</title>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kiwi: {
                            DEFAULT: '#4A6741', // Moss Green
                            light: '#8DA082',   // Soft Sage
                            dark: '#2D3E27',    // Forest Green
                        },
                        earth: {
                            cream: '#F9F9F4',   // Requested Cream
                            sand: '#EAE5D8',    // Earthy Sand
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],

                    borderRadius: {
                        'custom': '12px',
                    }
                }
            }

<style>
        body {
            font-family: "Public Sans", sans-serif;

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1;
        }

<style>

<body class="bg-earth-cream text-kiwi-dark font-sans min-h-screen flex flex-col">

<input class="bg-transparent border-none focus:ring-0 text-base w-full p-0 text-kiwi-dark placeholder-kiwi-light/70" placeholder="Search photos, albums..." type="text" value="Nature"/>

<span class="material-symbols-outlined">cancel</span>
</button>
</div>
</div>
<!-- Smart Filters -->

</div>
<div class="flex h-9 shrink-0 items-center justify-center gap-2 rounded-full bg-earth-sand/30 text-kiwi-dark/70 px-6 border border-earth-sand hover:text-kiwi-dark transition-colors cursor-pointer">
<span class="text-sm font-medium">Forest</span>
</div>
<div class="flex h-9 shrink-0 items-center justify-center gap-2 rounded-full bg-earth-sand/30 text-kiwi-dark/70 px-6 border border-earth-sand hover:text-kiwi-dark transition-colors cursor-pointer">
<span class="text-sm font-medium">Mountain</span>
