<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4ade80", // Vibrant leaf green for highlights
                        "background-light": "#f8f6f6",
                        "background-dark": "#0f1715", // Deep dark forest charcoal
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased">

</button>

<!-- Content Area -->
<main class="flex-1 overflow-y-auto flex flex-col items-center px-4 pt-4 pb-24">
<!-- Large Image Container -->
<div class="w-full max-w-2xl aspect-[3/4] rounded-xl overflow-hidden shadow-2xl shadow-black/50 ring-1 ring-white/10">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Sunlight streaming through deep green forest trees" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAcK2eaSfLBYWbSM57zGkI8HQ_G7oKjNmp8blSnJLhSMNaexzrzpO-SPKwQ2dHMHJQfvslpyV2WNg6gEazh68shndzL3MDltKZWp8VwLG5q7NXbD8FYTds5MCgpqyoDzcVqcRaHZgjEsrRNYAk2AFYt8sCWFvYPmvbb1PWMsprBcqIVlZuw5KcQa_JMrK646evZTxRWyG0yg46lbWT4wOnbwejnO_urJg-seNn_ijR84MqowTfH28D8XtrMICGqD4WElbwaMImP9NE");'>
</div>
</div>
<!-- Meta Information -->
<div class="w-full max-w-2xl mt-8 mb-4">
<div class="flex items-center justify-between mb-2">
<h2 class="text-3xl font-bold tracking-tight text-slate-100">Forest Dawn</h2>
<span class="px-3 py-1 rounded-full bg-primary/20 text-primary text-xs font-bold uppercase tracking-wider">RAW</span>
</div>
<p class="text-slate-400 text-lg leading-relaxed">
                    Captured in the deep wilderness during the first light of spring. The atmospheric mist creates a natural soft-focus effect.
                </p>

<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Location</span>
<span class="text-sm text-slate-200">Olympic National Park</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Date</span>
<span class="text-sm text-slate-200">April 12, 2024</span>
</div>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 right-0 border-t border-white/10 bg-background-dark/95 backdrop-blur-xl px-4 pb-8 pt-3">
