<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2d5a27", // Forest green primary
                        "background-light": "#f8f6f6",
                        "background-dark": "#0a0f0a",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>body {
    font-family: "Public Sans", sans-serif;
    background-color: #000
    }
.video-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBAxArnCAs8MNlc5-NY7TSqnYygHkoV2YgLCtX0nM38B5w7M0h7_ZWN9DJWKYWSKhRWv1xgIq_M1_pxHI-CnY5D2JnYgYjgmfhIkxY4D4amdosk0DX0dQ7w5pdttyShXYznZIBL46l0V84uL9HWWa8l0bvhrU9_xuRnrLtmi6dIC71WM1YeP7gCkXBbvqpocGoxV7wabz61Kk8zV7dPwlehuhWEbWDS68WxsTPz9J_KlufJVfsn-9I70nqKBtLhDI27fdTFRY0v0GA);
    background-size: cover;
    background-position: center
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-slate-100 flex items-center justify-center min-h-screen">
<!-- Mobile Screen Container -->
<div class="relative w-full max-w-[430px] aspect-[9/19.5] overflow-hidden shadow-2xl rounded-[3rem] border-[8px] border-slate-900 bg-black">
<!-- Video Background Layer -->
<div class="absolute inset-0 video-bg" data-alt="Serene waterfall in a lush green forest">
<!-- Dark Overlay for Readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60"></div>
</div>
<!-- Top Header Controls -->
<div class="relative z-10 flex items-center justify-between px-6 pt-14">
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white hover:bg-black/40 transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="flex gap-4">
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined text-[24px]">airplay</span>
</button>
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined text-[24px]">more_horiz</span>
</button>
</div>
</div>
<!-- Center Play State (Appears briefly or on tap) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="size-20 rounded-full bg-white/10 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white pointer-events-auto cursor-pointer hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[48px] fill-1">play_arrow</span>
</div>
</div>
<!-- Bottom Controls Section -->
<div class="absolute inset-x-0 bottom-0 z-10 px-6 pb-12 flex flex-col gap-6">
<!-- Video Info -->
<div class="flex flex-col gap-1">
<h1 class="text-white text-xl font-semibold tracking-tight">Forest Sanctuary</h1>
<p class="text-white/70 text-sm">Deep Woods Nature Reserve</p>
</div>
<!-- Progress Bar Area -->
<div class="flex flex-col gap-3">
<div class="relative h-1.5 w-full bg-white/20 rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary w-[45%] rounded-full"></div>
</div>
<div class="flex justify-between items-center">
<span class="text-white/80 text-xs font-medium tracking-wider">04:22</span>
<span class="text-white/80 text-xs font-medium tracking-wider">-05:18</span>
</div>
</div>
<!-- Main Playback Actions -->
<div class="flex items-center justify-between px-4">
<button class="text-white opacity-80 hover:opacity-100">
<span class="material-symbols-outlined text-[28px]">shuffle</span>
</button>
<div class="flex items-center gap-8">
<button class="text-white hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[36px] fill-1">skip_previous</span>
</button>
<button class="flex items-center justify-center size-16 rounded-full bg-white text-black hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[40px] fill-1">pause</span>
</button>
<button class="text-white hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[36px] fill-1">skip_next</span>
</button>
</div>
<button class="text-white opacity-80 hover:opacity-100">
<span class="material-symbols-outlined text-[28px]">repeat</span>
</button>
</div>
<!-- Sub Controls (Grid style from components) -->
<div class="grid grid-cols-4 gap-2 pt-4">
<div class="flex flex-col items-center gap-1.5">
<div class="size-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-white text-[20px]">volume_up</span>
</div>
<span class="text-[10px] uppercase tracking-widest text-white/60 font-bold">Audio</span>
</div>
<div class="flex flex-col items-center gap-1.5">
<div class="size-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-white text-[20px]">subtitles</span>
</div>
<span class="text-[10px] uppercase tracking-widest text-white/60 font-bold">Subs</span>
</div>
<div class="flex flex-col items-center gap-1.5">
<div class="size-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-white text-[20px]">speed</span>
</div>
<span class="text-[10px] uppercase tracking-widest text-white/60 font-bold">Speed</span>
</div>
<div class="flex flex-col items-center gap-1.5">
<div class="size-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-white text-[20px]">share</span>
</div>
<span class="text-[10px] uppercase tracking-widest text-white/60 font-bold">Share</span>
</div>
</div>
</div>
<!-- iPhone Notch/Island Area -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-8 bg-black rounded-b-2xl z-50"></div>
<!-- Home Indicator -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-white/30 rounded-full z-50"></div>
</div>
</body></html>
